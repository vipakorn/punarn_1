  return `<div class="offline-bar" role="status">ออฟไลน์ บันทึกไว้ในเครื่อง ${S.queue.length} รายการ ระบบจะส่งเองเมื่อกลับมาเชื่อมต่อ</div>`;
}
function setOffline(v) {
  S.offline = v;
  if (!v && S.queue.length) { const n = S.queue.length; S.queue = []; toast(`กลับมาออนไลน์แล้ว ส่งรายการที่บันทึกไว้ ${n} รายการเรียบร้อย`); }
  else toast(v ? 'จำลองอินเทอร์เน็ตขัดข้อง รายการใหม่จะเก็บไว้ในเครื่องก่อน' : 'กลับมาออนไลน์แล้ว');
  refresh();
}
const enqueue = what => { if (S.offline) S.queue.push(what); };

  if (!pb) { pb = document.createElement('div'); pb.className = 'protobar noprint'; document.body.appendChild(pb); }
  const open = pb.dataset.open === '1';
  pb.innerHTML = `<button type="button" aria-expanded="${open}" aria-controls="pb-menu"><span class="dot"></span><span class="pb-long">ต้นแบบ: เปลี่ยนบทบาท</span><span class="pb-short">ต้นแบบ</span></button>

    <button type="button" data-pb="reset">ล้างข้อมูลทดลองทั้งหมด</button>
    <p>ข้อมูลหนังสือ 200 เล่มมาจากไฟล์ CSV ส่วนโรงเรียน นักเรียน และสถิติเป็นข้อมูลจำลอง ข้อมูลที่กรอกจะหายเมื่อโหลดหน้าใหม่</p>
  </div>` : ''}`;
  pb.onclick = e => {
    e.stopPropagation();
    if (e.target.closest('button[aria-expanded]')) { pb.dataset.open = open ? '' : '1'; renderProtobar(); return; }
    const b = e.target.closest('[data-pb]');

    if (e.target.closest('a')) { pb.dataset.open = ''; renderProtobar(); }
  };
}

/* ---------- search (FR-M4-01, M4-05) ---------- */
function searchBooks(q) {
  const tk = norm(q).split(/\s+/).filter(Boolean);
  return BOOKS.filter(b => visible(b) && tk.every(t => b._idx.includes(t)));
}
function filterBooks(q) {
  let list = searchBooks(q.q || '');
  if (q.type) list = list.filter(b => b.g === q.type);
  if (q.cls) list = list.filter(b => b.cls.startsWith(q.cls));
  if (q.yr === 'new') list = list.filter(b => b.yce >= 2023);
  if (q.yr === 'mid') list = list.filter(b => b.yce >= 2013 && b.yce < 2023);
  if (q.yr === 'old') list = list.filter(b => b.yce < 2013);
  if (q.st === 'on') list = list.filter(b => b.s === 'on');
  if (q.lang === 'th') list = list.filter(b => b.lang === 'ไทย');
  if (q.lang === 'en') list = list.filter(b => b.lang === 'อังกฤษ');
  if (q.lv === 'low') list = list.filter(b => lvlRange(b.lvl)[1] <= 3);
  if (q.lv === 'high') list = list.filter(b => lvlRange(b.lvl)[0] >= 4);
  if (q.q) list.sort((a, b) => (norm(b.t).includes(norm(q.q)) - norm(a.t).includes(norm(q.q))));
  return list;
}
function sSearch(q) {
  const sel = (name, label, opts) => `<label class="sr" for="f-${name}">${label}</label><select id="f-${name}" name="${name}">${opts.map(([v, t]) => `<option value="${v}" ${(q[name] || '') === v ? 'selected' : ''}>${t}</option>`).join('')}</select>`;
  const filters = sel('type', 'ประเภท', [['', 'ทุกประเภท'], ...Object.entries(TYPE_LABEL)])
    + sel('cls', 'หมวด', [['', 'ทุกหมวด'], ...Object.values(DDC_CLASS).map(c => [c.slice(0, 3), 'หมวด ' + c])])
    + sel('yr', 'ปีที่พิมพ์', [['', 'ทุกปีที่พิมพ์'], ['new', 'พ.ศ. 2566 ขึ้นไป'], ['mid', 'พ.ศ. 2556–2565'], ['old', 'ก่อน พ.ศ. 2556']])
    + sel('st', 'สถานะ', [['', 'ทุกสถานะ'], ['on', 'อยู่บนชั้น ยืมได้']]);
  const keep = ['lang', 'lv'].filter(k => q[k]).map(k => `<input type="hidden" name="${k}" value="${esc(q[k])}">`).join('');
  return {
    title: 'ค้นหา', html: sWrap(`
    <div class="s-head"><h1 class="sr" tabindex="-1">ค้นหาหนังสือ</h1>
      <form class="search grow" role="search" style="margin:0" data-sform>
        <label class="sr" for="sq">ค้นหาหนังสือ</label>
        <input id="sq" name="q" type="search" value="${esc(q.q || '')}" placeholder="ชื่อหนังสือ ผู้แต่ง หรือวิชา" autocomplete="off" enterkeyhint="search" style="border:1px solid var(--line)" ${q.q || q.type || q.lang || q.lv ? '' : 'data-autofocus'}>
        <button aria-label="ค้นหา">${ICON.search}</button>
      </form></div>
    <form class="filters" data-filters aria-label="กรองผลการค้นหา">${filters}${keep}</form>
    <div id="res" aria-live="polite"></div>`, 'search'),
    mount(root) {
      const res = $('#res', root), form = $('[data-sform]', root), ff = $('[data-filters]', root);
      const read = () => { const o = { q: form.q.value.trim() }; new FormData(ff).forEach((v, k) => { if (v) o[k] = v; }); return o; };
      const draw = () => {
        const o = read(); const list = filterBooks(o);
        const qs = new URLSearchParams(Object.entries(o).filter(([, v]) => v)).toString();
        history.replaceState(null, '', '#/s/search' + (qs ? '?' + qs : ''));
        const anyFilter = Object.keys(o).some(k => k !== 'q' && o[k]);
        res.innerHTML = list.length
          ? `<p class="small muted" style="padding:0 16px 6px">พบ ${list.length} เล่ม${o.q ? ` สำหรับ “${esc(o.q)}”` : ''}</p>${list.slice(0, 60).map(resultRow).join('')}${list.length > 60 ? `<p class="small muted" style="padding:14px 16px">แสดง 60 เล่มแรก พิมพ์คำค้นเพิ่มเพื่อให้แคบลง</p>` : ''}`
          : `<div class="empty"><h2>ไม่พบหนังสือที่ตรงกับ “${esc(o.q)}”</h2><p>ลองใช้คำที่สั้นลง ค้นด้วยชื่อผู้แต่ง หรือ${anyFilter ? 'ล้างตัวกรองด้านบน' : 'เลือกจากหัวข้อด้านล่าง'}</p>
             <div class="subjects" style="margin-top:14px">${['นิยาย', 'คณิตศาสตร์', 'ภาษาอังกฤษ', 'ประวัติศาสตร์', 'วิทยาศาสตร์'].map(t => `<a class="chip" href="#/s/search?q=${encodeURIComponent(t)}">${t}</a>`).join('')}</div></div>`;
      };
      form.addEventListener('submit', e => { e.preventDefault(); form.q.blur(); draw(); });
      form.q.addEventListener('input', () => { clearTimeout(form._t); form._t = setTimeout(draw, 160); });
      ff.addEventListener('change', draw);
      draw();
    }
  };
}

/* ---------- book detail (FR-M4-02, US-04) ---------- */
function sBook(bc) {
  const b = BY[bc];
  if (!b) return { html: sWrap(`${sHead('ไม่พบหนังสือ')}<div class="empty"><h2>ไม่พบหนังสือเลขทะเบียน ${esc(bc)}</h2><p>หนังสืออาจถูกจำหน่ายออกแล้ว ลองค้นหาจากชื่อเรื่อง</p><p style="margin-top:14px"><a class="btn primary" href="#/s/search">ไปหน้าค้นหา</a></p></div>`, 'search') };
  const l = loanOf(bc);
  const [corner, floor] = String(b.loc).replace(')', '').split(' (');

    </section>

/* ================= Kiosk at the entrance (FR-M5-01, M5-02, M5-06) ================= */
function viewKiosk() {
  S.kioskOpened = true;
  let code = '', over = null, overT = null, msgT = null;
  const html = `<div class="kiosk">
    <section class="k-left" aria-label="ข้อมูลวันนี้">
      ${schoolMark('ห้องสมุด')}
      <div class="k-time num" id="k-time" aria-hidden="true">${hhmm(now())}</div>
      <div class="k-date">${thDay(TODAY)}</div>
      <div class="k-count" aria-live="polite">วันนี้มาห้องสมุดแล้ว <b class="num" id="k-n">${todayVisits().length}</b> คน</div>
    </section>
    <section class="k-right">
      ${offlineBar()}
      <h1 tabindex="-1">บันทึกการเข้าห้องสมุด</h1>
      <p class="hint">สแกนบัตรนักเรียน หรือพิมพ์รหัสประจำตัว 5 หลัก แล้วกดตกลง</p>
      <div class="k-display empty" id="k-disp" role="status" aria-live="polite">รหัสประจำตัว</div>
      <div id="k-msg" aria-live="assertive"></div>
      <div class="k-pad" role="group" aria-label="แป้นตัวเลข">
        ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button type="button" data-k="${n}">${n}</button>`).join('')}
        <button type="button" class="del" data-k="del" aria-label="ลบตัวเลข">ลบ</button>
        <button type="button" data-k="0">0</button>
        <button type="button" class="go" data-k="go">ตกลง</button>
      </div>
      <div class="try noprint"><span>ทดลอง:</span>
        <button type="button" data-try="41208">41208 มาครั้งแรกวันนี้</button>
        <button type="button" data-try="40115">40115 สแกนไปแล้ว 10:31</button>
        <button type="button" data-try="12345">12345 ไม่มีในโรงเรียน</button>
      </div>
      <button type="button" class="k-exit" id="k-exit">ออกจากโหมด kiosk (ครูกดค้าง 1 วินาที)</button>
    </section>
  </div>`;
  function show() {
    const d = $('#k-disp'); if (!d) return;
    d.classList.toggle('empty', !code);
    d.textContent = code ? code.split('').join(' ') : 'รหัสประจำตัว';
    d.setAttribute('aria-label', code ? 'รหัส ' + code : 'ยังไม่ได้พิมพ์รหัส');
  }
  function msg(t) { const m = $('#k-msg'); m.innerHTML = t ? `<div class="msg err" role="alert" style="font-size:1rem;margin:-4px 0 14px">${t}</div>` : ''; clearTimeout(msgT); if (t) msgT = later(() => msg(''), 5000); }
  function closeOver() { if (over) { over.remove(); over = null; clearTimeout(overT); } }
  function card(html, warn) {
    closeOver();
    over = document.createElement('div'); over.className = 'k-over'; over.setAttribute('role', 'alert');
    over.innerHTML = `<div class="k-card${warn ? ' warn' : ''}">${html}<div class="k-ring"><i></i></div></div>`;
    over.addEventListener('click', closeOver);
    app.appendChild(over); overT = later(closeOver, 3000);
  }
  function submit() {
    if (!code) return msg('พิมพ์รหัสประจำตัว 5 หลักก่อน แล้วกดตกลง');
    const id = code; code = ''; show();
    const st = SBY[id];
    if (!st) return msg(`ไม่พบรหัส ${esc(id)} ในโรงเรียนนี้ ตรวจรหัสบนบัตรอีกครั้ง หรือแจ้งครูที่เคาน์เตอร์`);
    const t = now();
    const prev = [...S.visits].reverse().find(v => v.sid === id && (t - v.t) < 30 * 60e3);
    if (prev) {
      return card(`<span class="badge" aria-hidden="true">!</span><h2>${esc(st.nick)} บันทึกไว้แล้ว</h2><p class="cls">${cls(st)} บันทึกเมื่อ ${hhmm(prev.t)} น. ครั้งนี้ไม่นับซ้ำ เข้าห้องสมุดได้เลย</p>`, true);
    }
    S.visits.push({ sid: id, t, src: 'kiosk' }); enqueue({ type: 'visit', sid: id });
    const month = st.mv + S.visits.filter(v => v.sid === id).length;
    $('#k-n').textContent = todayVisits().length;
    if (S.offline) { const ob = $('.offline-bar'); ob && (ob.textContent = `ออฟไลน์ บันทึกไว้ในเครื่อง ${S.queue.length} รายการ ระบบจะส่งเองเมื่อกลับมาเชื่อมต่อ`); }
    card(`<span class="badge" aria-hidden="true">${esc(firstCons(st.nick))}</span><h2>สวัสดี ${esc(st.nick)}</h2><p class="cls">${cls(st)}</p><p class="visits">เดือนนี้มาห้องสมุดแล้ว <b class="num">${month}</b> ครั้ง</p>`);
  }
  function key(k) {
    if (over) { closeOver(); if (k !== 'go') { /* let the next scan start immediately */ } else return; }
    if (k === 'del') code = code.slice(0, -1);
    else if (k === 'go') return submit();
    else if (code.length < 5) code += k;
    msg(''); show();
  }
  return {
    title: 'Kiosk', html,
    mount(root) {
      every(() => { const el = $('#k-time'); el && (el.textContent = hhmm(now())); }, 5000);
      $$('[data-k]', root).forEach(b => b.addEventListener('click', () => key(b.dataset.k)));
      $$('[data-try]', root).forEach(b => b.addEventListener('click', () => { code = b.dataset.try; show(); later(submit, 250); }));
      KEY = e => {
        if (e.target.closest && e.target.closest('input,textarea')) return;
        if (/^\d$/.test(e.key)) { key(e.key); e.preventDefault(); }
        else if (e.key === 'Backspace') { key('del'); e.preventDefault(); }
        else if (e.key === 'Enter' && !e.target.closest('button')) { key('go'); e.preventDefault(); }
      };
      const ex = $('#k-exit', root); let hold;
      const askPin = () => openDialog(`<h2 id="dlg-h">ออกจากโหมด kiosk</h2><p class="muted">ใส่ PIN ของครูผู้รับผิดชอบห้องสมุด (ทดลอง: 1234)</p>
        <form data-pin style="margin-top:14px"><label class="field"><span>PIN</span><input class="input" name="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" data-autofocus></label><div id="pin-msg" aria-live="assertive"></div>
        <div class="acts"><button type="button" class="btn" data-close>กลับไปหน้า kiosk</button><button class="btn primary">ออกจากโหมด kiosk</button></div></form>`, d => {
        $('[data-pin]', d).addEventListener('submit', e => { e.preventDefault(); if (e.target.pin.value === S.pin) { closeDialog(); go(S.role === 'assistant' ? '#/a/circ' : '#/t/today'); } else { $('#pin-msg').innerHTML = '<div class="msg err" role="alert">PIN ไม่ถูกต้อง ลองอีกครั้ง</div>'; e.target.pin.select(); } });
      });
      ex.addEventListener('pointerdown', () => { hold = setTimeout(askPin, 1000); });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => ex.addEventListener(t, () => clearTimeout(hold)));
      ex.addEventListener('click', e => { if (e.detail === 0) askPin(); });
    }
  };
}

  }

  if (!V) return { html: tShell('', 'ไม่พบหน้านี้', `<div class="panel"><p>ไม่พบหน้าที่ต้องการ</p><p style="margin-top:12px"><a class="btn" href="${base()}${isA() ? 'circ' : 'today'}">กลับหน้าแรก</a></p></div>`) };
  const v = V(q);
  return { title: v.title, html: tShell(page, v.title, v.body, v.actions || ''), mount: v.mount };
}

/* ---------- Circulation (FR-M3-01..04, NFR-02, NFR-05) ---------- */
function tCirc() {
  const C = S.circ || (S.circ = { mode: 'borrow', patron: null, basket: [], msg: null, returned: [] });
  return {
    title: 'ยืม-คืน',
    body: `<div class="tabs" role="tablist" aria-label="เลือกงาน">
        <button role="tab" id="tab-b" class="borrow" aria-selected="${C.mode === 'borrow'}" aria-controls="circ" data-mode="borrow">ยืม <kbd>F2</kbd></button>
        <button role="tab" id="tab-r" class="return" aria-selected="${C.mode === 'return'}" aria-controls="circ" data-mode="return">คืน <kbd>F4</kbd></button>
      </div>
      <section class="circ${C.mode === 'return' ? ' mode-return' : ''}" id="circ" role="tabpanel" aria-labelledby="${C.mode === 'return' ? 'tab-r' : 'tab-b'}"></section>`,
    mount(root) {
      const panel = $('#circ', root);
      const setMode = m => { C.mode = m; C.msg = null; refresh(); later(() => $('#scan')?.focus(), 0); };
      $$('[data-mode]', root).forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
      KEY = e => { if (e.key === 'F2') { e.preventDefault(); setMode('borrow'); } if (e.key === 'F4') { e.preventDefault(); setMode('return'); } };
      const quota = st => S.policy.max - loansOf(st.id).length - C.basket.length;
      const msgBox = () => C.msg ? `<div class="msg ${C.msg.k}${C.msg.k === 'ok' ? ' saved' : ''}" role="${C.msg.k === 'err' ? 'alert' : 'status'}"><div>${C.msg.h}${C.msg.act ? `<div style="margin-top:8px"><button class="btn sm" data-act>${C.msg.act[0]}</button></div>` : ''}</div></div>` : '';
      function drawBorrow() {
        const st = C.patron && SBY[C.patron];
        const step = st ? (C.basket.length ? 3 : 2) : 1;
        const stp = (n, t) => `<span class="${n < step ? 'done' : n === step ? 'on' : ''}"><i>${n < step ? '&#10003;' : n}</i>${t}</span>`;
        const due = nextSchoolDay(addDays(TODAY, S.policy.days));
        const tries = st ? BOOKS.filter(b => b.s === 'on' && !C.basket.includes(b.bc)).filter((b, i) => i % 37 === 3).slice(0, 4).map(b => b.bc).concat(['1000013', '1000999']) : ['41208', '40115', '45301', '1000013'];
        let pcard = '';
        if (st) {
          const my = loansOf(st.id), od = my.filter(l => diffDays(l.due, TODAY) < 0);
          pcard = `<div class="patron"><span class="avatar" aria-hidden="true">${esc(st.first[0])}</span><div><h3>${esc(fullName(st))}</h3><p class="small">${cls(st)} รหัส ${st.id}${isA() ? '' : ` ยืมอยู่ ${my.length} เล่ม`}</p>
            ${!isA() && my.length ? `<p class="small muted" style="margin-top:4px">${my.map(l => `${esc(shortTitle(BY[l.bc].t))} (${dueText(l.due).txt})`).join('<br>')}</p>` : ''}</div>
            <div class="quota num">${Math.max(0, quota(st))}<small>เล่มที่ยืมได้อีก</small></div></div>
            ${od.length ? `<div class="msg warn" role="status"><b>มีหนังสือเกินกำหนด ${od.length} เล่ม</b>&nbsp;${S.policy.block ? 'ตามนโยบายโรงเรียน ต้องคืนก่อนจึงยืมใหม่ได้' : 'เตือนให้นำมาคืน ยืมเล่มใหม่ได้ตามปกติ'}</div>` : ''}`;
        }
        panel.innerHTML = `<div class="stepper" aria-label="ขั้นตอน">${stp(1, 'ผู้ยืม')}${stp(2, 'หนังสือ')}${stp(3, 'บันทึก')}</div>
          <label class="field" for="scan"><span>${st ? 'สแกนบาร์โค้ดหนังสือ หรือพิมพ์เลขทะเบียน' : 'สแกนบัตรนักเรียน หรือพิมพ์รหัสประจำตัว'}</span></label>
          <form class="scan" data-scan><input class="input" id="scan" autocomplete="off" inputmode="numeric" placeholder="${st ? 'เลขทะเบียน 7 หลัก' : 'รหัส 5 หลัก'}" data-autofocus>
            <button class="btn">ตกลง</button><button type="button" class="btn" data-cam>${ICON.camera}ใช้กล้องมือถือ</button></form>
          <div class="try noprint"><span>ทดลอง:</span>${tries.map(t => `<button type="button" data-try="${t}">${t}</button>`).join('')}</div>
          ${msgBox()}${pcard}
          ${C.basket.length ? `<div class="basket" aria-label="หนังสือที่จะยืม">${C.basket.map(bc => { const b = BY[bc]; return `<div class="item">${cover(b)}<div><div class="t" style="font-weight:500">${esc(shortTitle(b.t))}</div><div class="small muted">${esc(b.call)} เลขทะเบียน ${bc}</div></div><div class="small">คืนภายใน ${thShort(due)}</div><button type="button" class="btn ghost sm" data-rm="${bc}" aria-label="นำ ${esc(shortTitle(b.t))} ออก">นำออก</button></div>`; }).join('')}</div>` : ''}
          ${st ? `<div class="row" style="justify-content:flex-end;margin-top:18px"><button type="button" class="btn" data-cancel>ยกเลิก</button><button type="button" class="btn primary" data-save ${C.basket.length ? '' : 'disabled'}>บันทึกการยืม ${C.basket.length || ''} เล่ม</button></div>
          <p class="small muted" style="text-align:right;margin-top:6px">กด Enter ที่ช่องว่างเพื่อบันทึกได้เลย</p>` : ''}`;
        bind();
      }
      function drawReturn() {
        const tries = S.loans.slice(0, 5).map(l => l.bc).concat(['1000002']);
        panel.innerHTML = `<label class="field" for="scan"><span>สแกนบาร์โค้ดหนังสือที่คืน หรือพิมพ์เลขทะเบียน</span></label>
          <form class="scan" data-scan><input class="input" id="scan" autocomplete="off" inputmode="numeric" placeholder="เลขทะเบียน 7 หลัก" data-autofocus>
            <button class="btn">ตกลง</button><button type="button" class="btn" data-cam>${ICON.camera}ใช้กล้องมือถือ</button></form>
          <div class="try noprint"><span>ทดลอง:</span>${tries.map(t => `<button type="button" data-try="${t}">${t}</button>`).join('')}</div>
          ${msgBox()}
          ${C.returned.length ? `<h2 style="font-size:1rem;margin:20px 0 4px">คืนแล้วรอบนี้ ${C.returned.length} เล่ม</h2><div class="basket">${C.returned.map(x => { const b = BY[x.bc], s = SBY[x.sid]; return `<div class="item">${cover(b)}<div><div style="font-weight:500">${esc(shortTitle(b.t))}</div><div class="small muted">${esc(fullName(s))} ${cls(s)}</div><div class="small">วางกลับที่${esc(b.loc)}</div></div>${x.late ? `<span class="pill late">เกินกำหนด ${x.late} วัน</span>` : '<span class="pill ok">คืนตรงเวลา</span>'}${spine(b.call, 'sm')}</div>`; }).join('')}</div>` : '<p class="small muted" style="margin-top:16px">สแกนทีละเล่มได้ต่อเนื่อง ระบบบันทึกการคืนทันทีที่สแกน</p>'}`;
        bind();
      }
      const draw = () => (C.mode === 'borrow' ? drawBorrow() : drawReturn());
      function doReturn(bc) {
        const l = loanOf(bc), b = BY[bc]; const late = Math.max(0, -diffDays(l.due, TODAY));
        S.loans = S.loans.filter(x => x !== l); b.s = 'on';
        S.log.push({ type: 'return', bc, sid: l.sid, t: now(), late }); enqueue({ type: 'return', bc });
        return { bc, sid: l.sid, late };
      }
      function scan(val) {
        val = val.trim(); if (!val) { if (C.mode === 'borrow' && C.basket.length) save(); return; }
        const b = BY[val], st = SBY[val];
        if (C.mode === 'return') {
          if (!b) C.msg = { k: 'err', h: `ไม่พบเลขทะเบียน ${esc(val)} ในห้องสมุดนี้ ตรวจเลขบนบาร์โค้ดอีกครั้ง` };
          else if (!loanOf(val)) C.msg = { k: 'warn', h: `<b>${esc(shortTitle(b.t))}</b> ไม่มีรายการยืมค้าง เล่มนี้อยู่ในสถานะ "${STATUS[b.s]}" อยู่แล้ว ถ้าต้องการยืม ให้สลับไปแท็บยืม` };
          else { const r = doReturn(val); C.returned.unshift(r); C.msg = { k: 'ok', h: `<b>บันทึกการคืนแล้ว</b>&nbsp;${esc(shortTitle(b.t))} ${r.late ? `เกินกำหนด ${r.late} วัน` : 'คืนตรงเวลา'}${S.offline ? ' (เก็บไว้ในเครื่อง รอส่ง)' : ''}` }; }
          return draw();
        }
        if (!C.patron) {
          if (st) { C.patron = val; C.msg = null; }
          else if (b) C.msg = { k: 'warn', h: `${esc(val)} เป็นเลขทะเบียนหนังสือ สแกนบัตรนักเรียนก่อน แล้วจึงสแกนหนังสือ` };
          else C.msg = { k: 'err', h: `ไม่พบรหัสนักเรียน ${esc(val)} ในโรงเรียนนี้ ตรวจรหัสบนบัตรอีกครั้ง` };
          return draw();
        }
        const me = SBY[C.patron];

function fakeQR(seed) {
  const r = mulberry32(seed), n = 21; let s = '';
  const finder = (x, y) => x < 7 && y < 7 || x > 13 && y < 7 || x < 7 && y > 13;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    let on;
    if (finder(x, y)) { const fx = x > 13 ? x - 14 : x, fy = y > 13 ? y - 14 : y; on = fx === 0 || fx === 6 || fy === 0 || fy === 6 || (fx > 1 && fx < 5 && fy > 1 && fy < 5); }
    else on = r() < 0.48;
    if (on) s += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<svg viewBox="-1 -1 23 23" width="150" height="150" fill="#16302E" role="img" aria-label="คิวอาร์โค้ดสำหรับเปิดบนมือถือ">${s}</svg>`;
}

function suggestDDC(text) {
  const t = norm(text); if (t.length < 2) return [];
  const exam = /ข้อสอบ|เตรียมสอบ|แนวข้อสอบ|ติวเข้ม|a-level|tgat|o-net|สอบเข้า/.test(t);
  const out = [];
  for (const [re, ddc, name] of DDC_RULES) {
    const m = t.match(re); if (!m) continue;
    const ex = exam && EXAM_DDC[ddc];
    const d = ex || ddc;
    const sim = BOOKS.filter(b => b.ddc === d);
    out.push({ ddc: d, name: name + (ex ? ' (แนวข้อสอบ)' : ''), why: `ชื่อเรื่องหรือคำสำคัญมีคำว่า “${m[0]}”${ex ? ' และเป็นหนังสือแนวข้อสอบ' : ''}${sim.length ? ` ห้องสมุดมีเล่มที่ใช้เลขนี้ ${sim.length} เล่ม เช่น “${shortTitle(sim[0].t)}”` : ''}` });
    const near = BOOKS.filter(b => norm(b.t).includes(m[0].toLowerCase()) && b.ddc !== d);
    if (near.length) {
      const tally = {}; near.forEach(b => tally[b.ddc] = (tally[b.ddc] || 0) + 1);
      const [nd, n] = Object.entries(tally).sort((a, b) => b[1] - a[1])[0];
      const ex2 = near.find(b => b.ddc === nd);
      out.push({ ddc: nd, name: DDC_CLASS[nd[0]].slice(4), why: `หนังสือคล้ายกันในห้องสมุด ${n} เล่มใช้เลขนี้ เช่น “${shortTitle(ex2.t)}”` });
    }
  }
  const seen = new Set(); return out.filter(o => !seen.has(o.ddc) && seen.add(o.ddc)).slice(0, 3);
}

            <label class="field"><span>ผู้แต่ง</span><input class="input" name="a" value="${esc(F.a || '')}"></label>
            <label class="field"><span>สำนักพิมพ์</span><input class="input" name="p" value="${esc(F.p || '')}"></label>
            <label class="field"><span>ปีที่พิมพ์ <em>(พ.ศ.)</em></span><input class="input" name="y" inputmode="numeric" value="${esc(F.y || '')}"></label>
            <label class="field"><span>ISBN <em>(ถ้ามี)</em></span><input class="input" name="isbn" inputmode="numeric" value="${esc(F.isbn || '')}"></label>
            <label class="field"><span>ประเภท</span><select class="input" name="type">${types.map(t => `<option ${F.type === t ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
            <label class="field"><span>ภาษา</span><select class="input" name="lang">${['ไทย', 'อังกฤษ', 'อื่น ๆ'].map(t => `<option ${F.lang === t ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
            <label class="field full"><span>คำสำคัญหรือหัวเรื่อง ${info('คำที่บอกว่าหนังสือเกี่ยวกับอะไร เช่น ฟิสิกส์ แนวข้อสอบ ระบบใช้คำนี้ช่วยแนะนำเลขหมู่และช่วยนักเรียนค้นหา')} <em>เช่น ฟิสิกส์ แนวข้อสอบ</em></span><input class="input" name="subj" value="${esc(F.subj || '')}"></label>
            <fieldset class="full" style="border:0;padding:0;margin:0"><legend class="ui" style="font-weight:500;font-size:.86rem;margin-bottom:6px">เลขหมู่ที่แนะนำ ${info('เลขหมู่บอกหมวดของหนังสือตามระบบทศนิยมดิวอี้ (DDC) ระบบเดาจากชื่อเรื่องและคำสำคัญ ครูเลือกเองได้เสมอ')}</legend><div class="suggest" id="sug"></div></fieldset>
          </form>${msg()}
          <div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn ghost" data-back>ย้อนกลับ</button><button class="btn primary" data-next>ถัดไป</button></div>`;
        const fm = $('[data-fm]', W), sug = $('#sug', W);
        const drawSug = () => {
          const list = suggestDDC(fm.t.value + ' ' + fm.subj.value);
          const cur = F.ddc;
          sug.innerHTML = (list.length ? list.map((s, i) => `<label><input type="radio" name="ddc" value="${s.ddc}" ${cur ? cur === s.ddc ? 'checked' : '' : i === 0 ? 'checked' : ''}><b>${s.ddc}</b><span>${esc(s.name)}<br><span class="small muted">${esc(s.why)}</span></span></label>`).join('') : `<p class="small muted">พิมพ์ชื่อเรื่องหรือคำสำคัญ ระบบจะแนะนำเลขหมู่ 2–3 ตัวเลือกพร้อมเหตุผล</p>`)
            + `<label><input type="radio" name="ddc" value="own" ${cur === 'own' ? 'checked' : ''}><b>อื่น ๆ</b><span>ใส่เลขหมู่เอง <input class="input" name="ddcOwn" value="${esc(F.ddcOwn || '')}" style="margin-top:6px;max-width:200px" inputmode="decimal" aria-label="เลขหมู่ที่ใส่เอง"></span></label>`;
        };
        drawSug();
        let tm; fm.addEventListener('input', e => { if (e.target.name === 't' || e.target.name === 'subj') { clearTimeout(tm); tm = setTimeout(() => { const keep = new FormData(fm); F.ddc = keep.get('ddc'); F.ddcOwn = keep.get('ddcOwn'); drawSug(); }, 250); } });
        $('[data-back]', W).addEventListener('click', reset);
        $('[data-next]', W).addEventListener('click', () => {
          const d = Object.fromEntries(new FormData(fm)); Object.assign(F, d);
          if (!d.t.trim()) { K.msg = { k: 'err', h: 'กรอกชื่อเรื่องก่อน' }; drawManual(); fm.t?.focus(); return; }
          let ddc = d.ddc === 'own' ? (d.ddcOwn || '').trim() : d.ddc;
          if (!ddc || !/^\d{3}(\.\d+)?$/.test(ddc)) { K.msg = { k: 'err', h: 'เลือกเลขหมู่ที่แนะนำ หรือใส่เลขหมู่เป็นตัวเลข 3 หลัก เช่น 510 หรือ 895.913' }; drawManual(); return; }
          K.rec = { isbn: d.isbn, t: d.t.trim(), a: d.a, p: d.p, y: d.y, pg: '', lang: d.lang, type: d.type, ddc, cls: DDC_CLASS[ddc[0]], subj: d.subj, lvl: 'ม.1-6', cv: '' };
          K.msg = null; K.step = 3; draw();
        });
      }
      function draw3() {
        const r = K.rec, bc = nextBarcode(), call = callNo(r.ddc, r.a, r.t), loc = locFor(r.type, r.lang);
        W.innerHTML = `${stepper()}<h2>ข้อมูลของเล่มนี้</h2>
          <div class="row" style="margin:12px 0 16px">${spine(call, 'sm')}<div><div style="font-weight:500">${esc(shortTitle(r.t))}</div><div class="small muted">${esc(r.a)}</div></div></div>
          <form class="grid2" data-f3>
            <label class="field"><span>เลขทะเบียน (บาร์โค้ด) ${info('เลขประจำตัวของหนังสือเล่มนี้ ระบบออกเลขถัดไปให้ และพิมพ์เป็นบาร์โค้ดติดหนังสือ')}</span><input class="input num" name="bc" value="${bc}" inputmode="numeric"></label>
            <label class="field"><span>เลขเรียกหนังสือ (call number) ${info('เลขหมู่ ตามด้วยอักษรผู้แต่งและอักษรชื่อเรื่อง พิมพ์บนป้ายสันหนังสือ ใช้หาหนังสือบนชั้น')}</span><input class="input" name="call" value="${esc(call)}"></label>
            <label class="field"><span>มุมจัดเก็บ</span><select class="input" name="loc">${LOCS.map(l => `<option ${l === loc ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
            <label class="field"><span>ได้มาโดย</span><select class="input" name="from"><option>ซื้อ</option><option>บริจาค</option><option>ได้รับจัดสรร</option></select></label>
            ${r.pg ? '' : '<label class="field"><span>จำนวนหน้า <em>(ถ้าทราบ)</em></span><input class="input" name="pg" inputmode="numeric"></label>'}
            <label class="field"><span>ราคา <em>(บาท ถ้าทราบ)</em></span><input class="input" name="price" inputmode="decimal"></label>
            <label class="field full"><span>หมายเหตุ <em>(ถ้ามี)</em></span><input class="input" name="note" placeholder="เช่น ผู้บริจาค หรือสภาพหนังสือ"></label>
          </form>${msg()}
          <div class="row wrap" style="justify-content:flex-end;margin-top:18px"><button class="btn ghost" data-back>ย้อนกลับ</button>
          ${A ? '<button class="btn primary" data-draft>ส่งร่างให้ครูตรวจ</button>' : '<button class="btn" data-next>บันทึกและลงเล่มต่อไป</button><button class="btn primary" data-print>บันทึกและพิมพ์ป้าย</button>'}</div>`;
        const f3 = $('[data-f3]', W);
        $('[data-back]', W).addEventListener('click', () => { K.step = 2; draw(); });
        const collect = () => { const d = Object.fromEntries(new FormData(f3)); if (BY[d.bc]) { K.msg = { k: 'err', h: `เลขทะเบียน ${esc(d.bc)} มีอยู่แล้ว ใช้เลข ${nextBarcode()} แทน` }; draw3(); return null; } return d; };
        const save = after => {
          const d = collect(); if (!d) return;
          const b = bookFromRecord(r, d); S.labelQueue.push(b.bc);
          S.audit.unshift({ t: now(), who: ME().name, what: `ลงรายการ "${shortTitle(b.t)}" เลขทะเบียน ${b.bc}` });
          const sec = Math.round((Date.now() - (K.t0 || Date.now())) / 1000);
          if (after === 'next') { toast(`บันทึกแล้ว ${shortTitle(b.t)} เลขทะเบียน ${b.bc} ลงเล่มต่อไปได้เลย`); reset(); return; }
          K.saved = { bc: b.bc, sec }; draw();
        };
        $('[data-next]', W)?.addEventListener('click', () => save('next'));
        $('[data-print]', W)?.addEventListener('click', () => save('print'));
        $('[data-draft]', W)?.addEventListener('click', () => {
          const d = Object.fromEntries(new FormData(f3));
          S.drafts.push({ ...r, id: 'd' + Date.now(), by: '43105', at: now(), call: d.call, loc: d.loc, from: d.from, donor: d.note, pg: d.pg || r.pg });
          K.saved = { draft: true, t: r.t }; draw();
        });
      }
      function drawDone() {
        const s = K.saved;
        if (s.draft) {
          W.innerHTML = `<div class="msg ok saved" role="status"><div><b>ส่งร่างให้ครูตรวจแล้ว</b>&nbsp;${esc(shortTitle(s.t))} ครูจะเห็นในหน้า "วันนี้"</div></div><p style="margin-top:18px"><button class="btn primary" data-again data-autofocus>ลงเล่มต่อไป</button></p>`;
        } else {
          const b = BY[s.bc];
          W.innerHTML = `<div class="msg ok saved" role="status"><div><b>บันทึกแล้ว</b>&nbsp;${esc(shortTitle(b.t))} เลขทะเบียน ${b.bc}${s.sec > 5 ? ` ใช้เวลา ${Math.floor(s.sec / 60)} นาที ${s.sec % 60} วินาที` : ''}</div></div>
            <div class="lbl-cell" style="max-width:360px;margin-top:18px;border-style:solid">${spine(b.call, 'sm')}<div>${barcode(b.bc)}<div class="bc">${b.bc}</div><div class="bt">${esc(shortTitle(b.t))}</div></div></div>
            <p class="small muted" style="margin-top:10px">ป้ายรอพิมพ์ ${S.labelQueue.length} ดวง พิมพ์ทีเดียวทั้งแผ่นได้ เพื่อประหยัดกระดาษสติกเกอร์</p>
            <div class="row wrap" style="margin-top:16px"><a class="btn primary" href="#/t/labels?mode=queue">พิมพ์ป้าย</a><button class="btn" data-again>ลงเล่มต่อไป</button><a class="btn ghost" href="#/s/book/${b.bc}">ดูหน้าที่นักเรียนเห็น</a></div>`;
        }
        $('[data-again]', W).addEventListener('click', reset);
      }
      draw();
    }
  };
}

/* ---------- Labels (FR-M2-04) ---------- */
function tLabels(q) {
  const mode = q.mode || (S.labelQueue.length ? 'queue' : 'range');
  const from = q.from || '1000001', to = q.to || '1000024', start = Math.min(24, Math.max(1, +(q.start || 1)));
  const list = (mode === 'queue' ? S.labelQueue.map(bc => BY[bc]) : BOOKS.filter(b => +b.bc >= +from && +b.bc <= +to).sort((a, b) => a.bc - b.bc)).filter(Boolean);
  const cells = Array(start - 1).fill(null).concat(list);
  const sheets = []; for (let i = 0; i < Math.max(1, cells.length); i += 24) sheets.push(cells.slice(i, i + 24));
  const cell = b => b ? `<div class="lbl-cell">${spine(b.call, 'sm')}<div>${barcode(b.bc)}<div class="bc">${b.bc}</div><div class="bt">${esc(shortTitle(b.t))}</div></div></div>` : `<div class="lbl-cell empty" aria-hidden="true"></div>`;
  return {
    title: 'พิมพ์ป้าย',
    actions: `<button class="btn primary noprint" data-printnow ${list.length ? '' : 'disabled'}>${ICON.print}สั่งพิมพ์ ${list.length} ดวง</button>`,
    body: `<form class="panel noprint" data-lf style="margin-bottom:18px">
      <div class="frow" style="margin:0">
        <fieldset style="border:0;padding:0;margin:0"><legend class="sr">เลือกหนังสือที่จะพิมพ์</legend><div class="seg">
          <button type="button" data-m="queue" aria-pressed="${mode === 'queue'}">ลงใหม่ รอพิมพ์ (${S.labelQueue.length})</button>
          <button type="button" data-m="range" aria-pressed="${mode === 'range'}">ตามช่วงเลขทะเบียน</button></div></fieldset>
        ${mode === 'range' ? `<label class="field"><span>ตั้งแต่เลข</span><input class="input num" name="from" value="${esc(from)}" inputmode="numeric"></label><label class="field"><span>ถึงเลข</span><input class="input num" name="to" value="${esc(to)}" inputmode="numeric"></label>` : ''}
        <label class="field"><span>เริ่มพิมพ์ที่ดวงที่ ${info('ใช้แผ่นสติกเกอร์ที่เหลือจากครั้งก่อนได้ เช่น แผ่นนี้ใช้ไปแล้ว 5 ดวง ให้เริ่มที่ดวงที่ 6')}</span><select class="input" name="start">${Array.from({ length: 24 }, (_, i) => `<option ${i + 1 === start ? 'selected' : ''}>${i + 1}</option>`).join('')}</select></label>
        <p class="small muted" style="align-self:center">กระดาษสติกเกอร์ A4 แบบ 3 × 8 ดวง</p>
      </div>
      ${mode === 'queue' && !list.length ? '<p class="muted" style="margin-top:12px">ไม่มีป้ายรอพิมพ์ ลงหนังสือใหม่ หรือเลือกตามช่วงเลขทะเบียน</p>' : ''}
    </form>
    ${list.length ? sheets.map((s, i) => `<p class="small muted noprint" style="margin:${i ? 18 : 0}px 0 8px">แผ่นที่ ${i + 1}</p><div class="sheet">${s.concat(Array(24 - s.length).fill(null)).map(cell).join('')}</div>`).join('') : ''}
    ${mode === 'queue' && list.length ? '<p class="noprint" style="margin-top:14px"><button class="btn" data-clearq>พิมพ์เรียบร้อยแล้ว ล้างคิว</button></p>' : ''}`,
    mount(root) {
      const f = $('[data-lf]', root);
      const upd = o => { const cur = { mode, from, to, start, ...o }; if (cur.mode === 'queue') { delete cur.from; delete cur.to; } history.replaceState(null, '', '#/t/labels?' + new URLSearchParams(cur)); refresh(); };
      $$('[data-m]', root).forEach(b => b.addEventListener('click', () => upd({ mode: b.dataset.m })));
      f.addEventListener('change', () => { const d = Object.fromEntries(new FormData(f)); upd(d); });
      $('[data-printnow]', root)?.addEventListener('click', () => window.print());
      $('[data-clearq]', root)?.addEventListener('click', () => { S.labelQueue = []; toast('ล้างคิวพิมพ์ป้ายแล้ว'); upd({ mode: 'range' }); });
    }
  };
}

/* ================= Teacher pages, part 2 ================= */

/* ---------- Items (FR-M2-06, FR-M2-08, FR-M2-10) ---------- */
function tItems() {
  const F = S.itemsF || (S.itemsF = { q: '', st: '', g: '', loc: '', n: 30 });
  return {
    title: 'ทรัพยากรทั้งหมด',
    actions: `<button class="btn" data-import>${ICON.import}นำเข้าจาก CSV หรือ Excel</button><button class="btn" data-exp>${ICON.export}ส่งออก CSV</button>`,
    body: `<form class="frow" data-if aria-label="ค้นหาและกรอง">
        <label class="field grow" style="min-width:240px"><span>ค้นหา</span><input class="input" id="iq" name="q" value="${esc(F.q)}" placeholder="ชื่อเรื่อง ผู้แต่ง เลขทะเบียน หรือ ISBN" autocomplete="off"></label>
        <label class="field"><span>สถานะ</span><select class="input" name="st"><option value="">ทุกสถานะ</option>${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${F.st === k ? 'selected' : ''}>${v}</option>`).join('')}<option value="late" ${F.st === 'late' ? 'selected' : ''}>เกินกำหนดคืน</option></select></label>
        <label class="field"><span>ประเภท</span><select class="input" name="g"><option value="">ทุกประเภท</option>${Object.entries(TYPE_LABEL).map(([k, v]) => `<option value="${k}" ${F.g === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
        <label class="field"><span>มุมจัดเก็บ</span><select class="input" name="loc"><option value="">ทุกมุม</option>${LOCS.map(l => `<option ${F.loc === l ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      </form><div class="panel" style="padding:8px 16px" id="itab"></div>`,
    mount(root) {
      const f = $('[data-if]', root), box = $('#itab', root);
      const draw = () => {
        Object.assign(F, Object.fromEntries(new FormData(f)));
        let list = F.q ? BOOKS.filter(b => b._idx.includes(norm(F.q))) : BOOKS.slice();
        if (F.st === 'late') list = list.filter(b => { const l = loanOf(b.bc); return l && diffDays(l.due, TODAY) < 0; }); else if (F.st) list = list.filter(b => b.s === F.st);
        if (F.g) list = list.filter(b => b.g === F.g); if (F.loc) list = list.filter(b => b.loc === F.loc);
        list.sort((a, b) => b.bc - a.bc);
        const opt = b => b.s === 'out' ? statusPill(b) : `<label class="sr" for="st-${b.bc}">สถานะของ ${esc(shortTitle(b.t))}</label><select class="input" id="st-${b.bc}" data-st="${b.bc}" style="min-height:36px;padding:4px 8px;width:auto">${Object.entries(STATUS).filter(([k]) => k !== 'out').map(([k, v]) => `<option value="${k}" ${b.s === k ? 'selected' : ''}>${v}</option>`).join('')}</select>`;
        box.innerHTML = `<p class="small muted" style="padding:8px 0">แสดง ${Math.min(F.n, list.length)} จาก ${list.length} รายการ (ทั้งห้องสมุด ${BOOKS.length} เล่ม)</p>
          <table class="tbl"><thead><tr><th></th><th>ชื่อเรื่อง</th><th>เลขเรียกหนังสือ</th><th>เลขทะเบียน</th><th>มุมจัดเก็บ</th><th>สถานะ</th></tr></thead><tbody>
          ${list.slice(0, F.n).map(b => `<tr><td>${cover(b)}</td><td><div class="t">${esc(shortTitle(b.t))}</div><div class="small muted">${esc(b.a)}</div></td><td class="num">${esc(b.call)}</td><td class="num">${b.bc}</td><td class="small">${esc(b.loc)}</td><td>${opt(b)}</td></tr>`).join('')}</tbody></table>
          ${list.length > F.n ? `<p style="padding:12px 0"><button class="btn sm" data-more>แสดงเพิ่มอีก 30 รายการ</button></p>` : ''}`;
        $('[data-more]', box)?.addEventListener('click', () => { F.n += 30; draw(); });
        $$('[data-st]', box).forEach(s => s.addEventListener('change', () => {
          const b = BY[s.dataset.st], v = s.value;
          const apply = reason => { b.s = v; S.audit.unshift({ t: now(), who: ME().name, what: `เปลี่ยนสถานะ ${b.bc} เป็น ${STATUS[v]}${reason ? ` (${reason})` : ''}` }); toast(`เปลี่ยนสถานะ ${shortTitle(b.t)} เป็น "${STATUS[v]}" แล้ว`); };
          if (v === 'gone') {
            openDialog(`<h2 id="dlg-h">จำหน่ายหนังสือออก</h2><p class="muted">${esc(shortTitle(b.t))} (${b.bc}) จะไม่แสดงในหน้าค้นหาของนักเรียน แต่ประวัติการยืมยังอยู่ครบ</p>
              <form data-gone style="margin-top:14px" class="stack"><label class="field"><span>เหตุผล</span><select class="input" name="r"><option>ชำรุดจนซ่อมไม่ได้</option><option>เนื้อหาล้าสมัย</option><option>สูญหายเกิน 1 ภาคเรียน</option><option>อื่น ๆ</option></select></label>
              <label class="field"><span>วันที่จำหน่าย</span><input class="input" name="d" value="${thDate(TODAY)}"></label>
              <div class="acts"><button type="button" class="btn" data-close>ยกเลิก</button><button class="btn primary">จำหน่ายออก</button></div></form>`, d => {
              $('[data-gone]', d).addEventListener('submit', e => { e.preventDefault(); apply(e.target.r.value); closeDialog(); draw(); });
              $('[data-close]', d).addEventListener('click', () => { s.value = b.s; });
            });
          } else apply();
        }));
      };
      let t; f.addEventListener('input', e => { if (e.target.name === 'q') { clearTimeout(t); t = setTimeout(() => { F.n = 30; draw(); }, 180); } });
      f.addEventListener('change', e => { if (e.target.name !== 'q') { F.n = 30; draw(); } });
      f.addEventListener('submit', e => e.preventDefault());
      draw();
      $('[data-exp]', root).addEventListener('click', () => exportItems());
      $('[data-import]', root).addEventListener('click', () => importDialog('items'));
    }
  };
}

/* simulated import with column mapping and error rows (FR-M1-04, FR-M2-06) */
function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true; else if (c === ',') { row.push(cell); cell = ''; } else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; } else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}

/* ---------- Admin: export (FR-M12-01, M12-02, NFR-11) ---------- */
function marcxml() {
  const x = s => esc(s);
  const sf = (c, v) => v ? `<subfield code="${c}">${x(v)}</subfield>` : '';
  const df = (tag, i1, i2, inner) => inner ? `\n  <datafield tag="${tag}" ind1="${i1}" ind2="${i2}">${inner}</datafield>` : '';
  return `<?xml version="1.0" encoding="UTF-8"?>\n<collection xmlns="http://www.loc.gov/MARC21/slim">` + BOOKS.map(b => `\n<record>\n  <leader>00000nam a2200000 a 4500</leader>\n  <controlfield tag="001">${b.bc}</controlfield>`
    + df('020', ' ', ' ', sf('a', b.isbn)) + df('082', '0', '4', sf('a', b.ddc)) + df('100', '1', ' ', sf('a', String(b.a).split(',')[0]))
    + df('245', '1', '0', sf('a', b.t)) + df('250', ' ', ' ', sf('a', b.ed)) + df('264', ' ', '1', sf('b', b.p) + sf('c', b.y)) + df('300', ' ', ' ', sf('a', b.pg ? b.pg + ' p.' : ''))
    + String(b.subj || '').split(';').filter(s => s.trim()).map(s => df('650', ' ', '4', sf('a', s.trim()))).join('')
    + df('852', ' ', ' ', sf('b', b.loc) + sf('h', b.call) + sf('p', b.bc)) + '\n</record>').join('') + '\n</collection>\n';
}

      <table class="tbl"><tbody>${items.map(([k, t, d, f]) => `<tr><td><div class="t">${t}</div><div class="small muted">${d}</div></td><td><span class="pill ref">${f}</span></td><td class="num"><button class="btn sm" data-x="${k}">${ICON.export}ดาวน์โหลด</button></td></tr>`).join('')}</tbody></table></section>
    <section class="panel"><h2>สำรองข้อมูลอัตโนมัติ</h2><p class="muted" style="margin-top:6px">ระบบสำรองข้อมูลทุกคืน ครั้งล่าสุด ${thDate(TODAY)} เวลา 02:00 น. เก็บย้อนหลัง 30 วัน</p></section>`,

/* ================= Statistics model (simulated, consistent everywhere) ================= */
const SEMS = [
  { id: '2/2567', months: [[2024, 10], [2024, 11], [2025, 0], [2025, 1], [2025, 2]], f: 0.86, reach: 0.51 },
  { id: '1/2568', months: [[2025, 4], [2025, 5], [2025, 6], [2025, 7], [2025, 8]], f: 1.0, reach: 0.55 },
  { id: '2/2568', months: [[2025, 10], [2025, 11], [2026, 0], [2026, 1], [2026, 2]], f: 1.05, reach: 0.58 },
  { id: '1/2569', months: [[2026, 4], [2026, 5], [2026, 6], [2026, 7], [2026, 8]], f: 1.13, reach: 0.64, current: true }
];
const PARTIAL = 10 / 21; // school days elapsed in Sep 2569 (to 14 Sep)
const GRADE_SH = [0.19, 0.18, 0.17, 0.16, 0.15, 0.15];
const FEMALE_SH = 0.58, FEMALE_POP = 0.52;
const SLOTS = [['before', 'ก่อนเข้าเรียน', '07:00–08:00', 0.15], ['class', 'ระหว่างคาบเรียน', '08:30–15:30', 0.23], ['lunch', 'พักกลางวัน', '12:00–13:00', 0.44], ['after', 'หลังเลิกเรียน', '15:30–16:30', 0.18]];
const MONTHS = [];
(function genModel() {
  const r = mulberry32(77);
  const base = { 4: 520, 5: 1180, 6: 1050, 7: 1210, 8: 1100, 10: 980, 11: 1040, 0: 1150, 1: 1320, 2: 410 };
  SEMS.forEach((s, si) => s.months.forEach(([y, m]) => {
    const partial = s.current && m === 8;
    let v = base[m] * s.f * (0.97 + r() * 0.06); if (partial) v *= PARTIAL;
    MONTHS.push({ y, m, sem: s.id, si, partial, visits: Math.round(v), loans: Math.round(v * (0.16 + r() * 0.02)), cls: Math.max(1, Math.round(v / 140 * (0.85 + r() * 0.3))) });
  }));
})();
const monthLabel = (mo, long) => `${(long ? TMF : TM)[mo.m]} ${String(mo.y + 543).slice(long ? 0 : 2)}`;
function factor(F, what) {
  let g = 1, x = 1, t = 1;
  if (F.grade === 'low') g = GRADE_SH.slice(0, 3).reduce((a, b) => a + b); else if (F.grade === 'high') g = GRADE_SH.slice(3).reduce((a, b) => a + b); else if (F.grade) g = GRADE_SH[+F.grade - 1];
  if (F.gender === 'f') x = what === 'pop' ? FEMALE_POP : FEMALE_SH; else if (F.gender === 'm') x = what === 'pop' ? 1 - FEMALE_POP : 1 - FEMALE_SH;
  if (F.slot) t = SLOTS.find(s => s[0] === F.slot)[3];
  if (what === 'cls') return F.grade ? g : 1;
  if (what === 'pop') return g * x;
  return g * x * t;
}
function semStats(si, F = {}) {
  const ms = MONTHS.filter(m => m.si === si);
  const v = ms.reduce((a, m) => a + m.visits, 0), l = ms.reduce((a, m) => a + m.loans, 0), c = ms.reduce((a, m) => a + m.cls, 0);
  const pop = SCHOOL.students * factor(F, 'pop');
  const visits = Math.round(v * factor(F)), uniq = Math.min(Math.round(pop * SEMS[si].reach * (F.slot ? 0.8 : 1)), visits);
  return { visits, loans: Math.round(l * factor(F)), cls: Math.round(c * factor(F, 'cls')), uniq, pop: Math.round(pop) };
}
/* same-period comparison: current semester vs same months last year, Sep scaled to the same share */
function semCompare(si, F) {
  const cur = semStats(si, F); const prevIdx = si - 2; if (prevIdx < 0) return { cur, prev: null };
  const ms = MONTHS.filter(m => m.si === prevIdx);
  const part = SEMS[si].current ? m => m.m === 8 ? PARTIAL : 1 : () => 1;
  const sum = k => Math.round(ms.reduce((a, m) => a + m[k] * part(m), 0));
  const prevAll = semStats(prevIdx, F);
  const prev = { visits: Math.round(sum('visits') * factor(F)), loans: Math.round(sum('loans') * factor(F)), cls: Math.round(sum('cls') * factor(F, 'cls')), uniq: Math.round(prevAll.uniq * (SEMS[si].current ? 0.93 : 1)) };
  return { cur, prev };
}
function apportion(total, shares) {
  const sum = shares.reduce((a, b) => a + b, 0), raw = shares.map(s => total * s / sum), out = raw.map(Math.floor);
  let rest = total - out.reduce((a, b) => a + b, 0);
  raw.map((r, i) => [r - Math.floor(r), i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (rest > 0) { out[i]++; rest--; } });
  return out;
}
function monthStats(y, m) {
  const mo = MONTHS.find(x => x.y === y && x.m === m);
  const r = mulberry32(y * 12 + m);
  const days = []; const last = mo.partial ? 14 : new Date(y, m + 1, 0).getDate();
  const hol = { '2026-7-12': 1, '2026-6-28': 1, '2026-6-29': 1, '2025-7-12': 1, '2025-11-5': 1, '2025-11-10': 1, '2026-0-1': 1 };
  for (let d = 1; d <= last; d++) { const dt = new Date(y, m, d); if (dt.getDay() && dt.getDay() < 6 && !hol[`${y}-${m}-${d}`]) days.push({ d: dt, w: 0.75 + r() * 0.5 + (dt.getDay() === 5 ? -0.15 : 0) }); }
  const W = days.reduce((a, x) => a + x.w, 0);
  apportion(mo.visits, days.map(x => x.w)).forEach((v, i) => days[i].v = v);
  const gv = apportion(mo.visits, GRADE_SH), gl = apportion(mo.loans, GRADE_SH);
  const byGrade = GRADE_SH.map((g, i) => { const f = Math.round(gv[i] * (FEMALE_SH + (i - 2.5) * 0.01)); return { g: i + 1, f, m: gv[i] - f, loans: gl[i] }; });
  const sv = apportion(mo.visits, SLOTS.map(s => s[3]));
  const bySlot = SLOTS.map((s, i) => ({ label: s[1], time: s[2], v: sv[i] }));
  const top = [...BOOKS].filter(b => b.g !== 'ref' && b.bc < '1000201').sort((a, b) => (hash(b.bc + m) % 30 + b.pop) - (hash(a.bc + m) % 30 + a.pop)).slice(0, 10).map((b, i) => ({ b, n: Math.max(3, Math.round(mo.loans / 22) - i) }));
  const classes = mo.y === 2026 && mo.m === 8 ? S.classUse : Array.from({ length: mo.cls }, (_, i) => ({ d: days[Math.floor((i + 0.5) * days.length / mo.cls)].d, slot: `คาบ ${2 + (i * 3) % 5}`, teacher: ['ครูสมชาย ใจดี', 'ครูอรอุมา แสงทอง', 'ครูมาลี ศรีวงศ์', 'ครูธวัชชัย บุญมา'][i % 4], subj: ['ภาษาไทย', 'วิทยาศาสตร์', 'ภาษาอังกฤษ', 'สังคมศึกษา', 'กิจกรรมส่งเสริมการอ่าน'][i % 5], room: `ม.${1 + (i * 5) % 6}/${1 + i % 4}`, n: 32 + (i * 7) % 4 }));
  const uniq = Math.round(SCHOOL.students * (0.38 + r() * 0.12) * (mo.partial ? 0.7 : 1));
  return { mo, days, byGrade, bySlot, top, classes, uniq, returns: Math.round(mo.loans * 0.96) };
}

/* ================= Chart helpers (single hue, one accent, hover tooltip, table view) ================= */
const C_HI = '#0D6E68', C_LO = '#7DB3AC', C_GRID = '#E2EAE8';
function vBar(x, y, w, h, r = 4) { if (h <= 0) return ''; r = Math.min(r, w / 2, h); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; }
function hBar(x, y, w, h, r = 4) { if (w <= 0) return ''; r = Math.min(r, h / 2, w); return `M${x},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h - r}Q${x + w},${y + h} ${x + w - r},${y + h}H${x}Z`; }
function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v || 1))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function chartCols(data, o = {}) {
  /* data: [{label, v, hi, tip, group}] */
  const W = o.w || 640, H = o.h || 220, L = 44, B = o.groups ? 46 : 26, T = 14, R = 6;
  const max = niceMax(Math.max(...data.map(d => d.v)) * 1.08); const ih = H - T - B, iw = W - L - R;
  const ticks = [4, 5, 2].find(t => Number.isInteger(max / t) && /^[125]0*$/.test(String(max / t))) || 4;
  let gaps = 0; data.forEach((d, i) => { if (i && d.group !== data[i - 1].group) gaps++; });
  const gapW = o.groups ? 14 : 0; const slot = (iw - gaps * gapW) / data.length; const bw = Math.max(4, slot - 2 - (o.pad ?? slot * 0.28));
  let s = '';
  for (let i = 0; i <= ticks; i++) { const y = T + ih - ih * i / ticks; s += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="${i ? C_GRID : '#B9C8C5'}" stroke-width="1"/><text x="${L - 8}" y="${y + 4}" text-anchor="end" font-size="11">${fmt(max * i / ticks)}</text>`; }
  let gx = 0, groups = [], gStart = L;
  data.forEach((d, i) => {
    if (i && d.group !== data[i - 1].group) { groups.push([data[i - 1].group, gStart, L + gx]); gx += gapW; gStart = L + gx; }
    const x = L + gx + (slot - bw) / 2, h = ih * d.v / max, y = T + ih - h;
    s += `<path d="${vBar(x, y, bw, h)}" fill="${d.hi ? C_HI : C_LO}"/>`;
    if (d.label) s += `<text x="${x + bw / 2}" y="${T + ih + 16}" text-anchor="middle" font-size="11">${esc(d.label)}</text>`;
    if (d.lab) s += `<text x="${x + bw / 2}" y="${y - 6}" text-anchor="middle" font-size="12" font-weight="600" style="fill:var(--ink)">${esc(d.lab)}</text>`;
    s += `<rect x="${L + gx}" y="${T}" width="${slot}" height="${ih}" fill="transparent" data-tip="${esc(d.tip)}"/>`;
    gx += slot;
  });
  if (o.groups) { groups.push([data[data.length - 1].group, gStart, L + gx]); groups.forEach(([g, a, b]) => { s += `<line x1="${a + 2}" x2="${b - 2}" y1="${T + ih + 26}" y2="${T + ih + 26}" stroke="#B9C8C5"/><text x="${(a + b) / 2}" y="${T + ih + 41}" text-anchor="middle" font-size="11.5" font-weight="500">${esc(g)}</text>`; }); }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria || '')}">${s}</svg>`;
}
function chartRows(data, o = {}) {
  const W = o.w || 420, rowH = 30, L = o.left || 118, R = 64, H = data.length * rowH + 6;
  const max = Math.max(...data.map(d => d.v)) || 1; let s = '';
  data.forEach((d, i) => {
    const y = 3 + i * rowH, w = (W - L - R) * d.v / max;
    s += `<text x="${L - 10}" y="${y + 17}" text-anchor="end" font-size="12" ${d.hi ? 'font-weight="600" style="fill:var(--ink)"' : ''}>${esc(d.label)}</text>`;
    s += `<path d="${hBar(L, y + 4, w, rowH - 10)}" fill="${d.hi ? C_HI : C_LO}"/>`;
    s += `<text x="${L + w + 8}" y="${y + 17}" font-size="12" style="fill:var(--ink)">${esc(d.lab ?? fmt(d.v))}</text>`;
    s += `<rect x="0" y="${y}" width="${W}" height="${rowH}" fill="transparent" data-tip="${esc(d.tip)}"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria || '')}">${s}</svg>`;
}
function bindTips(root) {
  let tt = $('.tt'); if (!tt) { tt = document.createElement('div'); tt.className = 'tt'; tt.hidden = true; document.body.appendChild(tt); }
  tt.style.cssText = 'position:fixed;pointer-events:none;padding:8px 10px;border-radius:8px;background:#16302E;color:#fff;font:400 .8rem/1.45 var(--ui);z-index:80;white-space:nowrap';
  $$('[data-tip]', root).forEach(el => {
    el.addEventListener('pointermove', e => { tt.hidden = false; tt.innerHTML = el.getAttribute('data-tip').replace(/\|/g, '<br>'); const r = tt.getBoundingClientRect(); let x = e.clientX + 14, y = e.clientY - r.height - 10; if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14; if (y < 8) y = e.clientY + 16; tt.style.left = x + 'px'; tt.style.top = y + 'px'; });
    el.addEventListener('pointerleave', () => { tt.hidden = true; });
  });
}

/* ================= Executive dashboard (FR-M6-04, FR-M6-06, US-06) ================= */
const GRADE_OPTS = [['', 'ทุกระดับชั้น'], ['low', 'ม.ต้น (ม.1–3)'], ['high', 'ม.ปลาย (ม.4–6)'], ['1', 'ม.1'], ['2', 'ม.2'], ['3', 'ม.3'], ['4', 'ม.4'], ['5', 'ม.5'], ['6', 'ม.6']];
function viewExec(q) {
  const F = { sem: q.sem ?? '3', grade: q.grade || '', gender: q.gender || '', slot: q.slot || '' };
  const si = +F.sem, sem = SEMS[si];
  const { cur, prev } = semCompare(si, F);
  const delta = (a, b, unit) => { if (!b) return `<div class="delta">ไม่มีข้อมูลภาคเรียนเดียวกันปีก่อน</div>`; const p = Math.round((a - b) / b * 100); return `<div class="delta ${p > 0 ? 'up' : p < 0 ? 'down' : ''}">${p > 0 ? '+' : ''}${p}% จาก${sem.current ? 'ช่วงเดียวกัน' : 'ภาคเรียนเดียวกัน'}ปีก่อน (${fmt(b)}${unit})</div>`; };
  const sel = (name, label, opts) => `<label class="field"><span>${label}</span><select class="input" name="${name}">${opts.map(([v, t]) => `<option value="${v}" ${F[name] === v ? 'selected' : ''}>${t}</option>`).join('')}</select></label>`;
  const fac = factor(F);
  const monthly = MONTHS.map(mo => ({ group: 'ภาคเรียน ' + mo.sem, label: TM[mo.m], v: Math.round(mo.visits * fac), hi: mo.si === si, tip: `<b>${monthLabel(mo, true)}</b>|ผู้เข้าใช้ ${fmt(Math.round(mo.visits * fac))} ครั้ง${mo.partial ? '|ถึง 14 ก.ย. 2569' : ''}` }));
  const semBars = k => SEMS.map((s, i) => { const v = semStats(i, F)[k]; return { group: '', label: s.id, v, hi: i === si, lab: i === si ? fmt(v) : '', tip: `<b>ภาคเรียน ${s.id}</b>|${k === 'loans' ? 'ยืม' : 'ใช้เป็นห้องเรียน'} ${fmt(v)} ${k === 'loans' ? 'เล่ม' : 'ครั้ง'}${s.current ? '|ถึง 14 ก.ย. 2569' : ''}` }; });
  const semMs = MONTHS.filter(m => m.si === si), semV = semMs.reduce((a, m) => a + m.visits, 0);
  const F2 = { ...F, slot: '' }, fg = factor(F2);
  const slotRows = SLOTS.map(s => { const v = Math.round(semV * fg * s[3]); return { label: s[1], v, hi: !F.slot || F.slot === s[0], tip: `<b>${s[1]}</b> ${s[2]} น.|${fmt(v)} ครั้ง (${Math.round(s[3] * 100)}%)` }; });
  const F3 = { ...F, grade: '' }, fgr = factor(F3);
  const inSel = g => !F.grade || F.grade === String(g) || (F.grade === 'low' && g <= 3) || (F.grade === 'high' && g >= 4);
  const gradeRows = GRADE_SH.map((sh, i) => { const v = Math.round(semV * fgr * sh), per = v / (SCHOOL.students / 6 * (F.gender === 'f' ? FEMALE_POP : F.gender === 'm' ? 1 - FEMALE_POP : 1)); return { label: 'ม.' + (i + 1), v, hi: inSel(i + 1), tip: `<b>ม.${i + 1}</b>|${fmt(v)} ครั้ง|เฉลี่ย ${per.toFixed(1)} ครั้งต่อคน` }; });
  const top = monthStats(...(sem.current ? [2026, 7] : [sem.months[3][0], sem.months[3][1]])).top;
  const semName = s => `ภาคเรียนที่ ${s.id}${s.current ? ' (ปัจจุบัน)' : ''}`;
  const filtTxt = [F.grade && GRADE_OPTS.find(g => g[0] === F.grade)[1], F.gender && (F.gender === 'f' ? 'นักเรียนหญิง' : 'นักเรียนชาย'), F.slot && SLOTS.find(s => s[0] === F.slot)[1]].filter(Boolean).join(' ');
  const html = `<header class="e-top">${schoolMark('ภาพรวมห้องสมุดสำหรับผู้บริหาร')}<span class="grow"></span><span class="small muted noprint">ข้อมูลถึง ${thDate(TODAY)}</span><button class="btn noprint acts" data-print>${ICON.print}ดาวน์โหลด PDF</button>${fszControl()}</header>
    <main class="e-body">
      <h1 tabindex="-1" style="margin-bottom:4px">การใช้ห้องสมุด ${semName(sem)}</h1>
      <p class="muted" style="margin-bottom:18px">${filtTxt ? `กรองเฉพาะ ${esc(filtTxt)} ` : ''}ตัวเลขทั้งหมดเป็นยอดรวม ไม่แสดงข้อมูลนักเรียนรายบุคคล</p>
      <form class="frow" data-ef aria-label="ตัวกรอง">
        ${sel('sem', 'ภาคเรียน', SEMS.map((s, i) => [String(i), semName(s)]).reverse())}
        ${sel('grade', 'ระดับชั้น', GRADE_OPTS)}
        ${sel('gender', 'เพศ', [['', 'ทุกเพศ'], ['f', 'หญิง'], ['m', 'ชาย']])}
        ${sel('slot', 'ช่วงเวลา', [['', 'ทุกช่วงเวลา'], ...SLOTS.map(s => [s[0], `${s[1]} (${s[2]})`])])}
        ${F.grade || F.gender || F.slot ? '<button type="button" class="linkbtn" data-clear style="align-self:center">ล้างตัวกรอง</button>' : ''}
      </form>
      <section class="strip" aria-label="ตัวเลขสรุป">
        <div><div class="lab">ผู้เข้าใช้ห้องสมุด</div><div class="val num">${fmt(cur.visits)}</div><div class="small muted">ครั้ง</div>${delta(cur.visits, prev && prev.visits, ' ครั้ง')}</div>
        <div><div class="lab">นักเรียนที่เคยเข้าใช้</div><div class="val num">${Math.round(cur.uniq / cur.pop * 100)}%</div><div class="small muted">${fmt(cur.uniq)} จาก ${fmt(cur.pop)} คน</div>${prev ? delta(cur.uniq, prev.uniq, ' คน') : delta(0, 0)}</div>
        <div><div class="lab">การยืมหนังสือ</div><div class="val num">${fmt(cur.loans)}</div><div class="small muted">เล่ม</div>${delta(cur.loans, prev && prev.loans, ' เล่ม')}</div>
        <div><div class="lab">ใช้เป็นห้องเรียน</div><div class="val num">${fmt(cur.cls)}</div><div class="small muted">ครั้ง${F.gender || F.slot ? ' (กรองได้เฉพาะระดับชั้น)' : ''}</div>${delta(cur.cls, prev && prev.cls, ' ครั้ง')}</div>
      </section>
      <div class="charts">
        <section class="panel chart wide" aria-labelledby="c1"><div class="chart-h"><h2 id="c1">ผู้เข้าใช้รายเดือน 4 ภาคเรียน</h2><button type="button" class="linkbtn" data-table="t1" aria-expanded="false">ดูเป็นตาราง</button></div>
          <p class="chart-sub">แท่งสีเข้มคือภาคเรียนที่เลือก เดือน ต.ค. และ เม.ย. เป็นช่วงปิดภาคเรียน เดือน ก.ย. 2569 นับถึงวันที่ 14</p>
          ${chartCols(monthly, { w: 1040, h: 250, groups: true, aria: 'กราฟแท่งจำนวนผู้เข้าใช้รายเดือน' })}
          <div class="legend"><span><i style="background:${C_HI}"></i>ภาคเรียนที่เลือก</span><span><i style="background:${C_LO}"></i>ภาคเรียนอื่น</span></div>
          <div id="t1" hidden><table class="tbl" style="margin-top:12px"><thead><tr><th>เดือน</th><th>ภาคเรียน</th><th class="num">ผู้เข้าใช้ (ครั้ง)</th><th class="num">ยืม (เล่ม)</th></tr></thead><tbody>${MONTHS.map(mo => `<tr><td>${monthLabel(mo, true)}${mo.partial ? ' (ถึง 14 ก.ย.)' : ''}</td><td>${mo.sem}</td><td class="num">${fmt(Math.round(mo.visits * fac))}</td><td class="num">${fmt(Math.round(mo.loans * fac))}</td></tr>`).join('')}</tbody></table></div>
        </section>
        <section class="panel chart" aria-labelledby="c2"><div class="chart-h"><h2 id="c2">การยืมหนังสือรายภาคเรียน</h2></div><p class="chart-sub">หน่วย: เล่ม</p>${chartCols(semBars('loans'), { w: 460, h: 210, pad: 40, aria: 'กราฟแท่งจำนวนการยืมรายภาคเรียน' })}</section>
        <section class="panel chart" aria-labelledby="c3"><div class="chart-h"><h2 id="c3">ใช้ห้องสมุดเป็นห้องเรียน</h2></div><p class="chart-sub">หน่วย: ครั้ง ครูบันทึกพร้อมรายวิชาและจำนวนนักเรียน</p>${chartCols(semBars('cls'), { w: 460, h: 210, pad: 40, aria: 'กราฟแท่งจำนวนครั้งที่ใช้เป็นห้องเรียน' })}</section>
        <section class="panel chart" aria-labelledby="c4"><div class="chart-h"><h2 id="c4">ช่วงเวลาที่เข้าใช้</h2></div><p class="chart-sub">ผู้เข้าใช้ในภาคเรียนที่เลือก หน่วย: ครั้ง</p>${chartRows(slotRows, { aria: 'กราฟแท่งแนวนอนตามช่วงเวลา' })}</section>
        <section class="panel chart" aria-labelledby="c5"><div class="chart-h"><h2 id="c5">ระดับชั้น</h2></div><p class="chart-sub">ผู้เข้าใช้ในภาคเรียนที่เลือก หน่วย: ครั้ง</p>${chartRows(gradeRows, { left: 60, aria: 'กราฟแท่งแนวนอนตามระดับชั้น' })}</section>
        <section class="panel chart wide" aria-labelledby="c6"><div class="chart-h"><h2 id="c6">หนังสือที่ถูกยืมมากที่สุด</h2><span class="small muted">${sem.current ? 'เดือน ส.ค. 2569' : 'เดือนที่ 4 ของภาคเรียน'}</span></div>
          <ol class="toplist" style="columns:2;column-gap:32px">${top.map(x => `<li style="break-inside:avoid">${cover(x.b)}<span>${esc(shortTitle(x.b.t))}<br><span class="small muted">${esc(x.b.type)}</span></span><span class="num small">${x.n} ครั้ง</span></li>`).join('')}</ol></section>
      </div>
      <p class="small muted" style="margin-top:18px">เริ่มเก็บข้อมูลในปันอ่านตั้งแต่ภาคเรียนที่ 2/2567 ข้อมูลเก็บถาวรแม้เปลี่ยนครูผู้รับผิดชอบ</p>
    </main>`;
  return {
    title: 'ภาพรวมผู้บริหาร', html,
    mount(root) {
      const f = $('[data-ef]', root);
      f.addEventListener('change', () => { const d = Object.fromEntries(new FormData(f)); Object.keys(d).forEach(k => d[k] === '' && delete d[k]); history.replaceState(null, '', '#/e?' + new URLSearchParams(d)); refresh(); });
      $('[data-clear]', root)?.addEventListener('click', () => { history.replaceState(null, '', '#/e?sem=' + F.sem); refresh(); });
      $('[data-print]', root).addEventListener('click', () => window.print());
      $$('[data-table]', root).forEach(b => b.addEventListener('click', () => { const t = $('#' + b.dataset.table); t.hidden = !t.hidden; b.setAttribute('aria-expanded', !t.hidden); b.textContent = t.hidden ? 'ดูเป็นตาราง' : 'ซ่อนตาราง'; }));
      bindTips(root);
    }
  };
}
